name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Daynote-Windows
          path: |
            dist/*.zip
            dist/*Setup.exe
